<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة قيادة د. ممدوح رزق الله | عز النخبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Ezz Elite brand: navy-deep header and brand panels, gold/sand/cream only on navy, steel-blue for actions. IBM Plex Sans Arabic 400/700. Layout: sales cockpit, summary first, lists become cards on phones. */
:root{
  --navy:#081724; --navy2:#192833; --gold:#f2c66b; --sand:#dcc99f; --cream:#fff8e8;
  --bg:#f3f4f6; --surface:#FFFFFF; --surface2:#f7f8fa; --ink:#231f1e; --muted:#6b7280; --line:#e5e7eb;
  --accent:#3a6174; --accent-soft:#e7eff3; --primary:#60879a; --brass:#192833; --brass-soft:#f6efdf; --focus:#3a6174;
  --good:#2C7A4B; --good-soft:#E2F1E7; --warn:#A8670F; --warn-soft:#FBF0DC; --bad:#d6312f; --bad-soft:#fde8e8;
  --font:"PingARLT","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:8px; --shadow:0 1px 2px rgba(8,23,36,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081724; --surface:#132634; --surface2:#0f2130; --ink:#fff8e8; --muted:#9aa6b2; --line:#2a3a47;
  --accent:#86adc0; --accent-soft:#16303f; --primary:#86adc0; --brass:#f2c66b; --brass-soft:#2a2a1f; --focus:#f2c66b;
  --good:#5BBF85; --good-soft:#173123; --warn:#E0A548; --warn-soft:#352812; --bad:#ff6b6b; --bad-soft:#3A1E18;
  --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#081724; --surface:#132634; --surface2:#0f2130; --ink:#fff8e8; --muted:#9aa6b2; --line:#2a3a47;
  --accent:#86adc0; --accent-soft:#16303f; --primary:#86adc0; --brass:#f2c66b; --brass-soft:#2a2a1f; --focus:#f2c66b;
  --good:#5BBF85; --good-soft:#173123; --warn:#E0A548; --warn-soft:#352812; --bad:#ff6b6b; --bad-soft:#3A1E18;
  --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--cream);border-bottom:2px solid var(--gold)}
.brand{display:flex;align-items:center;gap:14px;padding:10px 16px}
.mark{width:36px;height:36px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.brand h1{font-size:17px;font-weight:700}
.brand .sub{font-size:12px;color:var(--sand)}
.bm{display:grid;line-height:1.15;padding-inline-end:12px;border-inline-end:1px solid rgba(220,201,159,.35);flex:none;text-align:center}
.bm b{color:var(--gold);font-size:16px}.bm span{color:var(--sand);font-size:10.5px;letter-spacing:.06em}
.brand .grow{flex:1;min-width:0;padding-inline-start:14px;border-inline-start:1px solid rgba(220,201,159,.35)}
.sync{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,248,232,.1);color:var(--cream);white-space:nowrap}
.sync.live{background:var(--good-soft);color:var(--good)}
.sync.ro{background:var(--warn-soft);color:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:rgba(255,248,232,.78);font-weight:700;font-size:14px;padding:6px 12px;border-radius:99px;white-space:nowrap}
nav.tabs a:hover{background:rgba(255,248,232,.08);color:var(--cream)}
nav.tabs a.on{background:var(--gold);color:var(--navy)}
nav.tabs a:focus-visible{outline-color:var(--gold)}
main{max-width:1240px;margin:0 auto;padding:18px 16px 110px;display:grid;gap:18px}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;justify-content:space-between}
.vh h2{font-size:22px;font-weight:700}
.vh p{margin:2px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--line)}
.kpi.good::before{background:var(--good)}.kpi.warn::before{background:var(--warn)}.kpi.bad::before{background:var(--bad)}.kpi.info::before{background:var(--gold)}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:700}
.bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.b i{background:var(--gold)}
.kpi .t{font-size:12px;color:var(--muted)}
/* buttons */
.btn{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p{color:#fff}.btn.b{color:var(--gold)}
.btn.p:hover{filter:brightness(1.08);color:#fff}
.btn.b{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.btn.d{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search],.tools select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;min-width:0}
.tools input[type=search]{flex:1 1 200px}
/* pills */
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid transparent}
button.pill{cursor:pointer;border-color:var(--line)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}.pill.brass{background:var(--brass-soft);color:var(--brass)}
.cls{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-weight:700;font-size:13px}
.cls.A{background:var(--good);color:#fff}.cls.B{background:var(--accent);color:#fff}.cls.C{background:var(--warn);color:#fff}.cls.D{background:var(--bad);color:#fff}.cls.x{background:var(--surface2);color:var(--muted)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-size:12.5px;color:var(--muted);font-weight:700;background:var(--surface2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
td .s{color:var(--muted);font-size:12.5px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
@media (max-width:720px){
  .tw.cards{border:0;background:none;overflow:visible}
  .tw.cards table,.tw.cards tbody,.tw.cards tr,.tw.cards td{display:block;width:100%}
  .tw.cards thead{display:none}
  .tw.cards tr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;padding:8px 12px}
  .tw.cards td{border:0;padding:4px 0;display:flex;gap:10px;justify-content:space-between}
  .tw.cards td::before{content:attr(data-l);color:var(--muted);font-size:12px;font-weight:700;flex:none}
  .tw.cards td.main{display:block;font-weight:700;font-size:15px}
  .tw.cards td.main::before{display:none}
  .tw.cards td:empty,.tw.cards td.hide-m{display:none}
}
/* lists */
.list{display:grid;gap:8px}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.li .grow{flex:1;min-width:0}
.li .meta{font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none;background:var(--muted)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.good{background:var(--good)}.dot.acc{background:var(--accent)}
.hbar{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.hbar .bar{height:12px}
/* week blocks */
.week{display:grid;gap:8px}
.week-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.week-h h3{margin:0}
.week-h .bar{flex:1;min-width:120px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.task:hover{border-color:var(--accent)}
.task.done{background:var(--surface2)}
.task.done .tt{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.task .dn{width:40px;text-align:center;border-radius:8px;background:var(--accent-soft);color:var(--accent);padding:4px 0;font-weight:700;font-size:13px;line-height:1.2}
.task .dn small{display:block;font-weight:700;font-size:10.5px}
.task .tt{font-weight:700}
.task .out{font-size:13px;color:var(--muted)}
.task .act{font-size:13px;color:var(--good);margin-top:2px}
.task .side{display:grid;gap:6px;justify-items:end}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,20,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.md{background:var(--surface);border-radius:8px;width:100%;max-width:720px;box-shadow:0 20px 50px rgba(0,0,0,.25);border:1px solid var(--line)}
.md header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.md header h3{font-size:17px;font-weight:700}
.md .bd{padding:16px 18px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.md footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.f{display:grid;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 10px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:11.5px;color:var(--muted)}
.rate{display:flex;gap:4px}
.rate button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 0;cursor:pointer;font-weight:700}
.rate button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.scorebox{grid-column:1/-1;display:flex;gap:14px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--accent-soft)}
.scorebox b{font-size:24px}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
/* fab */
.fab{position:fixed;inset-inline-start:18px;bottom:18px;z-index:30;display:grid;justify-items:start;gap:8px}
.fab .main{width:56px;height:56px;border-radius:99px;background:var(--navy);color:var(--gold);border:2px solid var(--gold) !important;border:0;font-size:28px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.2)}
.fab .menu{display:none;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:var(--shadow)}
.fab.open .menu{display:grid}
.fab .menu button{border:0;background:none;text-align:start;padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:700}
.fab .menu button:hover{background:var(--surface2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:60;font-weight:700;font-size:14px;max-width:90vw}
.note{padding:10px 14px;border-radius:8px;background:var(--brass-soft);color:var(--ink);font-size:13.5px;border:1px solid var(--line)}
.note.warn{background:var(--warn-soft)}
.guide dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0}
.guide dt{font-weight:700;color:var(--accent)}
.guide dd{margin:0}
@media (max-width:600px){.brand h1{font-size:15px}.brand .sub{display:none}.guide dl{grid-template-columns:1fr}.guide dt{margin-top:6px}.hbar{grid-template-columns:96px 1fr 40px}}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.report h2{font-size:20px;font-weight:700;margin-bottom:2px}
.report h4{margin:18px 0 8px;font-size:14px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px}
.report ul{margin:0;padding-inline-start:18px}
.report li{margin:3px 0}
.rk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rk div{background:var(--surface2);border-radius:8px;padding:8px 10px;border:1px solid var(--line)}
.rk span{display:block;font-size:12px;color:var(--muted)}
.rk b{font-size:18px}
.spark{display:flex;align-items:flex-end;gap:3px;height:70px;padding-top:6px}
.spark i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.spark i.z{background:var(--line)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring b{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:20px;font-weight:700}
.owner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r);background:var(--navy);color:var(--cream);border:1px solid rgba(242,198,107,.35);box-shadow:var(--shadow)}
.owner .av{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.owner img.av{object-fit:cover;padding:0;background:var(--navy2)}
.owner .grow{flex:1;min-width:0}
.owner .ol{font-size:12px;opacity:.75}
.owner .on{font-size:22px;font-weight:700;line-height:1.25}
.owner .or{font-size:13px;color:var(--sand)}
.owner .oday b{color:var(--gold)}
.owner .oday{text-align:center;padding-inline-start:14px;border-inline-start:1px solid rgba(220,201,159,.35)}
.owner .oday b{display:block;font-size:26px;line-height:1}.owner .oday span{font-size:11.5px;opacity:.8}

let AUTH_USER=null,ROLE=null,LIVE_STARTED=false,LAST_ERR=null;S.roles={editors:[],viewers:[]};
const CONF=window.EZZ_CONFIG||{};
const OWNER=String(CONF.ownerEmail||"").trim().toLowerCase();
function fbReady(){return !!(window.firebase&&CONF.firebase&&CONF.firebase.apiKey&&!/^PASTE/.test(CONF.firebase.apiKey))}
function fileDL(){return{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data],{type:/\.json$/.test(filename)?"application/json":/\.csv$/.test(filename)?"text/csv":/\.html$/.test(filename)?"text/html":"application/octet-stream"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:"saved"}}}}
async function boot(){
  window.addEventListener("hashchange",route);route(true);
  DL=fileDL();
  if(!fbReady()){MODE="local";const o=lsGet();if(o){S.config=o.config;COLS.forEach(c=>S[c]=o[c]||[])}setSync();render();return}
  firebase.initializeApp(CONF.firebase);
  DB=firebase.firestore();
  // Long-polling تلقائي: يحل مشكلة الشبكات/البرامج اللي بتقفل اتصال Firestore المستمر
  try{DB.settings({ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
  // حفظ محلي للتعديلات: أي تعديل وقت انقطاع الاتصال بيتحفظ ويترفع أول ما الاتصال يرجع، حتى لو اتقفلت الصفحة
  try{await DB.enablePersistence({synchronizeTabs:true})}catch(e){console.warn("persistence",e&&e.code)}
  firebase.auth().onAuthStateChanged(async u=>{
    AUTH_USER=u;
    if(!u){MODE="auth";setSync();render();return}
    MODE="loading";setSync();render();
    ROLE=await resolveRole(u);
    if(!ROLE){MODE="noaccess";setSync();render();return}
    startLive();
  });
}
async function resolveRole(u){
  const em=String(u.email||"").toLowerCase();
  if(OWNER&&em===OWNER)return"owner";
  try{const r=await DB.doc("meta/roles").get();if(!r.exists)return null;const d=r.data()||{};
    const low=a=>(a||[]).map(x=>String(x).toLowerCase());
    if(low(d.editors).includes(em))return"editor";if(low(d.viewers).includes(em))return"viewer";}catch(e){}
  return null}
function startLive(){
  if(LIVE_STARTED)return;LIVE_STARTED=true;
  MODE="live";CAN_WRITE=ROLE!=="viewer";UID=AUTH_USER.email;setSync();render();
  const db=DB;
  const timer=setTimeout(()=>{if(loaded.size<COLS.length+1){STALE=true;setSync();render();diagnose()}},10000);
  const done=k=>{loaded.add(k);if(loaded.size>=COLS.length+1){clearTimeout(timer);if(STALE){STALE=false;setSync()}}};
  COLS.forEach(c=>{db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));if(!snap.metadata.fromCache)done(c);schedule()},err=>{LAST_ERR=err;done(c);console.warn(c,err);render()})});
  db.doc("meta/config").onSnapshot(s=>{S.config=s.exists?s.data():null;if(!s.metadata.fromCache)done("config");schedule()},err=>{LAST_ERR=err;done("config");render()});
  if(ROLE==="owner")db.doc("meta/roles").onSnapshot(s=>{const d=s.exists?s.data():{};S.roles={editors:d.editors||[],viewers:d.viewers||[]};schedule()},()=>{});
}
/* تشخيص: لما Firestore مايردش، نسأل الـ REST API مباشرة علشان نعرف السبب الحقيقي */
let DIAG="";
async function diagnose(){
  try{const tok=await AUTH_USER.getIdToken();const pid=CONF.firebase.projectId;
    const r=await fetch(`https://firestore.googleapis.com/v1/projects/${pid}/databases/(default)/documents/meta/config`,{headers:{Authorization:"Bearer "+tok}});
    let j={};try{j=await r.json()}catch(e){}
    const msg=(j.error&&(j.error.message||j.error.status))||"";
    if(r.ok||r.status===404&&/not found|NOT_FOUND/i.test(msg)&&!/database/i.test(msg))DIAG="قاعدة البيانات شغالة وبترد، والمشكلة في الاتصال المستمر من المتصفح ده. جرّب تقفل أي VPN أو إضافة حجب إعلانات، أو افتح الصفحة من متصفح تاني.";
    else if(/does not exist/i.test(msg)&&/database/i.test(msg))DIAG="قاعدة بيانات Firestore لسه ماتعملتش في المشروع. من Firebase Console افتح Build ← Firestore Database واضغط Create database (Production mode).";
    else if(/has not been used|is disabled|SERVICE_DISABLED/i.test(msg))DIAG="خدمة Cloud Firestore API مش متفعّلة. من Firebase Console افتح Firestore Database واضغط Create database، أو فعّل Cloud Firestore API من Google Cloud Console.";
    else if(r.status===403)DIAG="قاعدة البيانات رفضت الصلاحية. اتأكد إن قواعد الأمان (Rules) اتنشرت بإيميل المالك الصحيح.";
    else DIAG=`رد الخادم (${r.status}): ${msg}`;
  }catch(e){DIAG="المتصفح مش قادر يوصل لخوادم Google Firestore خالص (شبكة، VPN، أو إضافة حجب). جرّب شبكة أو متصفح تاني."}
  render()}

let rq=0;function schedule(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
function denied(){CAN_WRITE=false;setSync();toast("ليس لديك صلاحية التعديل على هذا النظام");render()}
async function save(col,rec){
  if(!CAN_WRITE){toast("وضع العرض فقط");return false}
  const now=new Date().toISOString();const id=rec.id||uid();const body=Object.assign({},rec);delete body.id;
  if(!body.createdAt)body.createdAt=now;body.updatedAt=now;if(UID&&!body.by)body.by=UID;
  Object.keys(body).forEach(k=>{if(body[k]===undefined)delete body[k]});
  if(MODE==="live"){try{await DB.collection(col).doc(id).set(body)}catch(e){if(e&&(e.code==="invalid_argument"||e.code==="permission-denied")){denied();return false}if(e&&e.code==="quota_exceeded"){toast("امتلأت سعة قاعدة البيانات. احذف سجلات قديمة.");return false}
      try{await new Promise(r=>setTimeout(r,600+Math.random()*600));await DB.collection(col).doc(id).set(body)}catch(e2){toast("تعذر الحفظ، حاول مرة أخرى");return false}}}
  else{const arr=S[col];const i=arr.findIndex(x=>x.id===id);const full=Object.assign({},body,{id});if(i>=0)arr[i]=full;else arr.push(full);lsSet();schedule()}
  return id}

/* ============ KPI engine ============ */
function kpis(a,b){
  const inR=d=>a?inRange(d,a,b):true;
  const cust=S.customers.filter(c=>inR(created(c)));
  const visitsDone=S.visits.filter(v=>v.status==="منفذة"&&inR(v.date));
  const visitsPlanned=S.visits.filter(v=>inR(v.date));
  const qualified=S.customers.filter(c=>QUAL.includes(c.stage)&&inR(created(c)));
  const quotesOpp=S.opps.filter(o=>["Quotation","Negotiation","Won"].includes(o.stage)&&inR(created(o)));
  const won=S.customers.filter(c=>c.stage==="Won"&&inR(c.lastContact||created(c)));
  const orders=S.orders.filter(o=>validOrder(o)&&inR(o.date));
  const sales=orders.reduce((s,o)=>s+lineNet(o),0);
  const daily=S.daily.filter(d=>inR(d.date));
  const sum=k=>daily.reduce((s,d)=>s+n(d[k]),0);
  const open=S.opps.filter(oppOpen);
  return{prospects:cust.length,visits:Math.max(visitsDone.length,sum("done")),visitsPlanned:visitsPlanned.length,qualified:qualified.length,
    quotes:Math.max(quotesOpp.length,sum("quotes")),accounts:won.length,sales:Math.max(sales,sum("sales")),orders:new Set(orders.map(o=>o.orderId||o.id)).size,
    pipeline:open.reduce((s,o)=>s+n(o.value),0),forecast:open.reduce((s,o)=>s+weighted(o),0),openOpps:open.length,
    followups:sum("follow"),quotesValue:sum("quotesValue"),daily}}
function kpiTile(label,val,target,{money:m,info}={}){
  const p=target?pct(val,target):null;const tone=info?"info":p==null?"":p>=90?"good":p>=50?"warn":"bad";
  return `<div class="kpi ${tone}"><div class="l">${label}</div><div class="v num">${m?fmt(val):fmt(val)}${target?` <small>/ ${fmt(target)}</small>`:m?" <small>ر.س</small>":""}</div>
  ${target?`<div class="bar"><i style="width:${Math.min(p,100)}%"></i></div><div class="t">${p}% من المستهدف</div>`:`<div class="t">${info||""}</div>`}</div>`}

function sparkVisits(){const days=[];for(let i=13;i>=0;i--)days.push(addDays(TODAY,-i));
  const vals=days.map(d=>{const v=S.visits.filter(x=>x.date===d&&x.status==="منفذة").length;const dl=S.daily.find(x=>x.date===d);return Math.max(v,dl?n(dl.done):0)});
  const mx=Math.max(1,...vals);const tot=vals.reduce((a,b)=>a+b,0);
  return `<div class="spark">${vals.map((v,i)=>`<i class="${v?"":"z"}" style="height:${v?Math.max(8,v/mx*100):3}%" title="${days[i]}: ${v}"></i>`).join("")}</div><div class="row" style="justify-content:space-between;font-size:12px;color:var(--muted)"><span>${dshort(days[0])}</span><span>الإجمالي ${tot} · الأعلى ${mx===1&&!tot?0:mx}</span><span>${dshort(days[13])}</span></div>`}
function groupWeeks(tasks){const m=new Map();[...tasks].sort((a,b)=>(n(a.day)-n(b.day))||((a.date||"")>(b.date||"")?1:-1)).forEach(t=>{const w=t.week||"بدون أسبوع";if(!m.has(w))m.set(w,[]);m.get(w).push(t)});
  return [...m].map(([name,items])=>({name,items,done:items.filter(t=>t.status==="مكتمل").length}))}

function planWeeks(){const g=groupWeeks(planTasks());return g.map(w=>{const ds=w.items.map(t=>t.date).filter(Boolean).sort();return{name:w.name,a:ds[0],b:ds[ds.length-1]}}).filter(w=>w.a)}
function repRange(){const r=UI.rep,c=cfg();
  if(r.preset==="plan")return[c.period_start,c.period_end,"الخطة كاملة"];
  if(r.preset==="7")return[addDays(TODAY,-6),TODAY,"آخر 7 أيام"];
  if(r.preset==="today")return[TODAY,TODAY,"اليوم"];
  if(r.preset==="custom")return[r.a||c.period_start,r.b||TODAY,"فترة مخصصة"];
  const w=planWeeks().find(x=>x.name===r.preset);if(w)return[w.a,w.b,w.name];return[c.period_start,c.period_end,"الخطة كاملة"]}
function buildReport(){
  const [a,b,label]=repRange();const c=cfg(),T=c.targets;const k=kpis(a,b);
  const tasks=planTasks().filter(t=>inRange(t.date,a,b));const tDone=tasks.filter(t=>t.status==="مكتمل");
  const tLate=tasks.filter(t=>t.status!=="مكتمل"&&t.date<TODAY);
  const wins=S.wins.filter(w=>inRange(w.date,a,b));
  const visits=S.visits.filter(v=>v.status==="منفذة"&&inRange(v.date,a,b));
  const objections=[...S.opps.filter(o=>o.objection&&oppOpen(o)).map(o=>`${o.customer}: ${o.objection}`),...k.daily.map(d=>d.market).filter(Boolean)];
  const open=S.opps.filter(oppOpen).sort((x,y)=>weighted(y)-weighted(x)).slice(0,6);
  const low=S.products.filter(p=>["إعادة طلب","غير متاح"].includes(prodCalc(p).st));
  const nb=addDays(b,1),ne=addDays(b,7);
  const nextT=planTasks().filter(t=>inRange(t.date,nb,ne)&&t.status!=="مكتمل");
  const aCust=S.customers.filter(x=>klass(score(x))==="A");
  const lines=[["Prospects جدد",k.prospects,T.prospects],["زيارات منفذة",k.visits,T.visits],["Qualified Leads",k.qualified,T.qualified],["عروض أسعار",k.quotes,T.quotes],["حسابات جديدة",k.accounts,T.accounts]];
  return{a,b,label,k,T,tasks,tDone,tLate,wins,visits,objections,open,low,nextT,aCust,lines,c}}

function reportText(R){

  L.push(`• مبيعات محققة: ${money(R.k.sales)}`,`• Weighted Forecast: ${money(R.k.forecast)}`,"",`*تنفيذ الخطة:* ${R.tDone.length}/${R.tasks.length} (${pct(R.tDone.length,R.tasks.length)}%)`);
  R.tDone.forEach(t=>L.push(`✓ ${t.title}${t.actual?` — ${t.actual}`:""}`));R.tLate.forEach(t=>L.push(`⚠ متأخرة: ${t.title}`));
  if(R.wins.length){L.push("","*الإنجازات*");R.wins.forEach(w=>L.push(`• ${w.title}${w.value?` (${money(w.value)})`:""}`))}

  if(R.objections.length){L.push("","*ملاحظات السوق*");R.objections.slice(0,5).forEach(o=>L.push(`• ${o}`))}
  if(R.low.length){L.push("","*نواقص المخزون*");R.low.forEach(p=>L.push(`• ${p.name}`))}

function fieldHTML(f,v,rec){

  if(f.t==="rate")return `<div class="f"><label>${f.l}</label><div class="rate" data-rate="${f.k}">${[1,2,3,4,5].map(i=>`<button type="button" class="${n(v)===i?"on":""}" data-v="${i}">${i}</button>`).join("")}</div></div>`;
  let inp;
  if(f.t==="select"){const opts=typeof f.o==="function"?f.o():f.o;inp=`<select id="${id}" name="${f.k}">${f.req?"":`<option value=""></option>`}${opts.map(o=>{const [val,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v)===String(val)?"selected":""}>${esc(Array.isArray(o)&&val!==l?`${l} · ${val}`:l)}</option>`}).join("")}</select>`}
  else if(f.t==="textarea")inp=`<textarea id="${id}" name="${f.k}" ${f.req?"required":""}>${esc(v)}</textarea>`;

  return `<div class="f ${f.full?"full":""}"><label for="${id}">${f.l}${req}</label>${inp}${f.hint?`<div class="hint">${f.hint}</div>`:""}</div>`}
function openForm(ent,id){

  });
  $("#ov").addEventListener("click",e=>{if(e.target.id==="ov"||e.target.closest("[data-close]"))closeForm()});
  const del=$("#delBtn");if(del)del.addEventListener("click",()=>askDelete(ent,id));
}

  for(const f of sc.fields){if(f.t==="score"||f.t==="rate")continue;const el=frm.querySelector(`[name="${f.k}"]`);if(!el)continue;let v=el.value.trim();if(f.t==="number"&&v!=="")v=n(v);rec[f.k]=v}
  const miss=sc.fields.filter(f=>f.req&&(rec[f.k]===""||rec[f.k]==null));if(miss.length){toast("كمّل الحقول المطلوبة: "+miss.map(f=>f.l).join("، "));return}

  const btn=frm.querySelector("button[type=submit]");if(btn)btn.disabled=true;
  if(id)rec.id=id;const newId=await save(ent,rec);if(!newId){if(btn)btn.disabled=false;return}
  if(logWin&&rec.status==="مكتمل"&&FORM.prevStatus!=="مكتمل"){await save("wins",{date:TODAY,type:"مخرج مهمة",title:rec.output||rec.title,detail:rec.actual||"",goal:rec.title})}
  if(syncCust&&rec.status==="منفذة"){const cu=S.customers.find(c=>c.name===rec.customer);if(cu){const up=Object.assign({},cu,{lastContact:rec.date>(cu.lastContact||"")?rec.date:cu.lastContact});if(rec.next){up.next=rec.next;if(rec.followDate)up.nextDate=rec.followDate}if(cu.stage==="New Prospect"||cu.stage==="Contacted"||cu.stage==="Qualified")up.stage="Visit/Meeting";await save("customers",up)}}
  closeForm();toast("تم الحفظ")}

 daily:[["date","التاريخ"],["planned","مخططة"],["done","منفذة"],["newCust","عملاء جدد"],["qualified","Qualified"],["quotes","عروض"],["quotesValue","قيمة العروض"],["sales","مبيعات"],["follow","متابعات"],["market","ملاحظة السوق"],["tomorrow","أولوية الغد"]],

const SHEET_NAMES={tasks:"Action_Plan",customers:"Customer_CRM",visits:"Visit_Planner",opps:"Sales_Pipeline",orders:"Order_Items",products:"Products_Stock",daily:"Daily_Activity",wins:"Wins_Outputs"};
function rowsFor(ent){return S[ent].map(r=>EXPORT_COLS[ent].map(([k])=>typeof k==="function"?k(r):(r[k]??"")))}
async function saveFile(name,data){if(!DL){toast("التحميل غير متاح هنا");return}try{await DL.save({filename:name,data});}catch(e){if(e&&e.code==="declined")return;toast("تعذر التحميل")}}
function csv(ent){const head=EXPORT_COLS[ent].map(c=>c[1]);const q=v=>{const s=String(v??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  return "﻿"+[head,...rowsFor(ent)].map(r=>r.map(q).join(",")).join("\n")}
async function exportCSV(ent){if(DL)return saveFile(`EzzElite_${SHEET_NAMES[ent]}_${TODAY}.csv`,csv(ent));try{await navigator.clipboard.writeText(csv(ent));toast("تم نسخ البيانات، الصقها في Excel")}catch(e){toast("تعذر النسخ")}}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s)})}
async function exportXLSX(){toast("جارٍ تجهيز ملف Excel…");try{const X=await loadXLSX();const wb=X.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  const R=buildReport();const k=kpis();const T=cfg().targets;
  const dash=[["لوحة مؤشرات B2B Sales – عز النخبة",""],["لوحة قيادة","د. ممدوح رزق الله – مدير المبيعات"],["تاريخ التصدير",TODAY],[],["المؤشر","الفعلي","المستهدف"],["Prospects",k.prospects,T.prospects],["زيارات منفذة",k.visits,T.visits],["Qualified Leads",k.qualified,T.qualified],["عروض أسعار",k.quotes,T.quotes],["حسابات جديدة",k.accounts,T.accounts],["مبيعات محققة SAR",k.sales,T.sales],["Weighted Forecast SAR",Math.round(k.forecast),""],["Pipeline مفتوح SAR",k.pipeline,""],["مهام مكتملة",R.tDone.length,R.tasks.length]];
  const ws0=X.utils.aoa_to_sheet(dash);ws0["!cols"]=[{wch:28},{wch:16},{wch:14}];X.utils.book_append_sheet(wb,ws0,"Dashboard");
  COLS.forEach(ent=>{const ws=X.utils.aoa_to_sheet([EXPORT_COLS[ent].map(c=>c[1]),...rowsFor(ent)]);ws["!cols"]=EXPORT_COLS[ent].map(c=>({wch:Math.max(12,Math.min(40,c[1].length+6))}));X.utils.book_append_sheet(wb,ws,SHEET_NAMES[ent])});
  const out=X.write(wb,{type:"array",bookType:"xlsx"});await saveFile(`EzzElite_Sales_OS_${TODAY}.xlsx`,new Blob([out]))}catch(e){toast("تعذر إنشاء ملف Excel")}}
function reportDoc(R){const css=[...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
  return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير عز النخبة ${R.a} | د. ممدوح رزق الله</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet"><style>${css} body{padding:20px}.report{max-width:900px;margin:0 auto}</style></head><body>${reportHTML(R)}</body></html>`}
async function importJSON(file){try{const o=JSON.parse(await file.text());toast("جارٍ الاسترجاع…");const c=await importObject(o);toast(`تم استرجاع ${c} سجل`)}catch(e){toast("الملف غير صالح أو تعذر الحفظ")}}

/* ============ events ============ */
document.addEventListener("click",async e=>{
  const t=e.target;
  const cyc=t.closest("[data-cycle]");if(cyc){e.stopPropagation();const tk=S.tasks.find(x=>x.id===cyc.dataset.cycle);if(!tk)return;const i=TASK_ST.indexOf(tk.status||"لم يبدأ");const nx=TASK_ST[(i+1)%TASK_ST.length];
    await save("tasks",Object.assign({},tk,{status:nx}));if(nx==="مكتمل")toast("اكتملت ✓ افتح المهمة لتسجيل المخرج الفعلي");return}
  const ed=t.closest("[data-edit]");if(ed&&!t.closest("a")){const [ent,id]=ed.dataset.edit.split(":");openForm(ent,id);return}
  const ad=t.closest("[data-add]");if(ad){$("#fab").classList.remove("open");openForm(ad.dataset.add);return}
  const cs=t.closest("[data-csv]");if(cs){exportCSV(cs.dataset.csv);return}
  if(t.closest("#fabbtn")){$("#fab").classList.toggle("open");return}
  if(!t.closest("#fab"))$("#fab").classList.remove("open");
  if(t.id==="copyRep"){const txt=reportText(buildReport());try{await navigator.clipboard.writeText(txt);toast("تم نسخ التقرير، الصقه في واتساب")}catch(err){toast("تعذر النسخ")}}
  if(t.id==="dlRep"){const R=buildReport();saveFile(`EzzElite_Report_${R.a}_${R.b}.html`,reportDoc(R))}
  if(t.id==="dlXlsx")exportXLSX();
  if(t.id==="bkOut"){const o={exportedAt:new Date().toISOString(),config:cfg()};COLS.forEach(c=>o[c]=S[c]);saveFile(`EzzElite_Backup_${TODAY}.json`,JSON.stringify(o,null,1))}
  if(t.id==="bkCopy"){const o={config:cfg()};COLS.forEach(c=>o[c]=S[c]);try{await navigator.clipboard.writeText(JSON.stringify(o));toast("تم النسخ")}catch(err){toast("تعذر النسخ")}}
  if(t.id==="newPlan")openPlanDialog();
  if(t.id==="signin")signIn();
  if(t.id==="signout")signOut();
  if(t.id==="seedBtn"){t.disabled=true;try{const r=await fetch("seed-data.json",{cache:"no-store"});const o=await r.json();const c=await importObject(o);toast(`تم تحميل ${c} سجل`)}catch(e){toast("تعذر تحميل بيانات التأسيس");t.disabled=false}}
  const ar=t.closest("[data-addrole]");if(ar){const k=ar.dataset.addrole;const el=$("#add-"+k);const v=(el.value||"").trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast("اكتب إيميل صحيح");return}const r={editors:[...S.roles.editors],viewers:[...S.roles.viewers]};["editors","viewers"].forEach(x=>r[x]=r[x].filter(e=>e!==v));r[k].push(v);await setRoles(r);toast("تمت الإضافة")}
  const rr=t.closest("[data-rmrole]");if(rr){const [k,v]=rr.dataset.rmrole.split(/:(.+)/);const r={editors:[...S.roles.editors],viewers:[...S.roles.viewers]};r[k]=r[k].filter(e=>e!==v);await setRoles(r);toast("تمت الإزالة")}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.q){UI.q[t.dataset.q]=t.value;render()}
  if(t.id==="planQ"){(UI.f.plan=UI.f.plan||{}).q=t.value;render()}});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.dataset.f){const [v,k]=t.dataset.f.split(":");(UI.f[v]=UI.f[v]||{})[k]=t.value;render()}
  if(t.id==="planSt"){(UI.f.plan=UI.f.plan||{}).st=t.value;render()}
  if(t.id==="planSel"){if(CAN_WRITE)await saveCfg({active_plan:t.value});else{S.config=Object.assign({},cfg(),{active_plan:t.value});render()}}
  if(t.id==="repPreset"){UI.rep.preset=t.value;render()}
  if(t.id==="repA"){UI.rep.a=t.value;render()}if(t.id==="repB"){UI.rep.b=t.value;render()}
  if(t.id==="bkIn"&&t.files[0])importJSON(t.files[0]);
});
document.addEventListener("submit",async e=>{if(e.target.id==="tgtForm"){e.preventDefault();const fd=new FormData(e.target);const tg={};["prospects","visits","qualified","quotes","accounts","sales"].forEach(k=>tg[k]=n(fd.get(k)));
  await saveCfg({targets:tg,period_start:fd.get("period_start")||DEFAULT_CFG.period_start,period_end:fd.get("period_end")||DEFAULT_CFG.period_end});toast("تم حفظ المستهدفات")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&FORM)closeForm()});
function openPlanDialog(){$("#modal").innerHTML=`<div class="ov" id="ov"><form class="md" id="pfrm" style="max-width:460px"><header><h3>خطة جديدة</h3><button type="button" class="btn sm" data-close>إغلاق</button></header>
  <div class="bd"><div class="f full"><label for="pname">اسم الخطة</label><input id="pname" required placeholder="مثال: خطة 60 يوم – يناير وفبراير"></div>
  <div class="f full"><label class="chk"><input type="checkbox" id="pact" checked> اجعلها الخطة النشطة</label></div></div>
  <footer><button class="btn p" type="submit">إنشاء</button></footer></form></div>`;
  setTimeout(()=>$("#pname").focus(),30);
  $("#ov").addEventListener("click",e=>{if(e.target.id==="ov"||e.target.closest("[data-close]"))closeForm()});
  $("#pfrm").addEventListener("submit",async e=>{e.preventDefault();const nm=$("#pname").value.trim();if(!nm)return;const c=cfg();if(c.plans.includes(nm)){toast("الاسم موجود");return}
    await saveCfg({plans:[...c.plans,nm],active_plan:$("#pact").checked?nm:c.active_plan});closeForm();toast("تم إنشاء الخطة. أضف مهامها من + مهمة")})}
